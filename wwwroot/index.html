<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__APP_NAME__</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <aside class="sidebar" aria-label="拼图设置">
          <div class="brand-row">
            <div>
              <h1>__APP_NAME__</h1>
              <p>自动排版拼图工具</p>
            </div>
            <button class="icon-button" id="clearButton" type="button" title="清空图片" aria-label="清空图片">×</button>
          </div>

          <label class="drop-zone" id="dropZone">
            <input id="fileInput" type="file" accept="image/*" multiple>
            <span class="drop-title">拖入图片或点击选择</span>
            <span class="drop-hint">支持 JPG、PNG、WEBP，可多次添加</span>
          </label>

          <form class="controls" id="settingsForm">
            <section class="page-panel" aria-label="分页设置">
              <div class="page-panel-header">
                <span>分页</span>
                <strong id="pageCountLabel">0 页</strong>
              </div>
              <div class="page-count-control">
                <label>
                  <span>分成页数</span>
                  <input id="targetPageCountInput" name="targetPageCount" type="number" min="1" max="31" value="1">
                </label>
                <button class="secondary-button" id="redistributePagesButton" type="button">重新分页</button>
              </div>
            </section>

            <section class="template-panel" aria-label="模板选择">
              <div class="template-header">
                <span>模板</span>
                <strong id="templateCountLabel">自动</strong>
              </div>
              <input id="templateInput" name="template" type="hidden" value="auto">
              <div class="template-grid" id="templateGrid"></div>
              <label class="equal-grid-control is-hidden" id="equalGridControl">
                <span>等格比例 <strong id="equalGridRatioValue">1:1</strong></span>
                <input id="equalGridRatioInput" name="equalGridRatio" type="range" min="0.35" max="2.8" step="0.05" value="1">
              </label>
            </section>

            <div class="control-grid">
              <label>
                <span>宽度</span>
                <input name="width" type="number" min="400" max="6000" value="1080">
              </label>
              <label>
                <span>高度</span>
                <input name="height" type="number" min="400" max="6000" value="1920">
              </label>
              <label>
                <span>间距</span>
                <input name="gap" type="number" min="0" max="120" value="18">
              </label>
              <label>
                <span>边距</span>
                <input name="padding" type="number" min="0" max="200" value="28">
              </label>
              <label>
                <span>圆角</span>
                <input name="radius" type="number" min="0" max="80" value="18">
              </label>
              <label>
                <span>背景</span>
                <input name="background" type="color" value="#ffffff">
              </label>
            </div>

            <fieldset class="mode-group">
              <legend>画布比例</legend>
              <label><input type="radio" name="mode" value="Auto"><span>自动</span></label>
              <label><input type="radio" name="mode" value="Square"><span>方形</span></label>
              <label><input type="radio" name="mode" value="Portrait" checked><span>竖版</span></label>
              <label><input type="radio" name="mode" value="Landscape"><span>横版</span></label>
            </fieldset>

            <button class="primary-button" id="generateButton" type="submit">导出当前页</button>
          </form>

          <section class="project-panel" aria-label="项目与更新">
            <div class="update-card" id="updateCard" hidden>
              <strong id="updateTitle">发现新版本</strong>
              <p id="updateText">可以从 GitHub Release 更新。</p>
              <div class="project-actions">
                <button class="secondary-button" id="installUpdateButton" type="button">立即更新</button>
                <a class="text-link" id="releaseLink" href="https://github.com/CasseShimada/Collager/releases" target="_blank" rel="noreferrer">Release</a>
              </div>
            </div>
            <p>Collager 是免费开源软件，仅在 GitHub 免费发布。任何公开售卖 Collager 的行为均为骗局。</p>
            <p>
              <a href="https://github.com/CasseShimada/Collager" target="_blank" rel="noreferrer">GitHub</a>
              · <a href="https://github.com/CasseShimada/Collager/releases" target="_blank" rel="noreferrer">Release</a>
              · <a href="https://github.com/CasseShimada/Collager/issues" target="_blank" rel="noreferrer">Issue</a>
            </p>
            <p>遇到 bug 或有建议，可以通过 GitHub Issue 反馈。</p>
          </section>
        </aside>

        <section class="preview-pane" aria-label="拼图预览">
          <div class="preview-stage" id="previewStage">
            <div class="preview-toolbar" aria-label="页面与预览控制">
              <div class="page-tabs" id="pageTabs" aria-label="页面切换"></div>
              <div class="preview-actions">
                <div class="export-menu">
                  <button class="zoom-button export-menu-button" id="exportMenuButton" type="button" title="选择导出页面" aria-label="选择导出页面">导出</button>
                  <div class="export-popover" id="exportPopover" hidden>
                    <div class="export-popover-header">
                      <span>导出页面</span>
                      <button class="text-button" id="exportAllButton" type="button">全部导出</button>
                    </div>
                    <div class="export-page-list" id="exportPageList"></div>
                    <div class="export-popover-actions">
                      <button class="secondary-button" id="exportSelectedButton" type="button">导出所选</button>
                    </div>
                  </div>
                </div>
                <div class="preview-zoom-controls" aria-label="预览缩放">
                  <button class="zoom-button" id="previewZoomOut" type="button" title="缩小预览" aria-label="缩小预览">-</button>
                  <button class="zoom-button zoom-value" id="previewZoomFit" type="button" title="适合窗口" aria-label="适合窗口">适合</button>
                  <button class="zoom-button" id="previewZoomIn" type="button" title="放大预览" aria-label="放大预览">+</button>
                  <span id="previewZoomLabel">--</span>
                </div>
              </div>
            </div>
            <div class="empty-state" id="emptyState">
              <p>图片会在这里预览</p>
            </div>
            <div class="editable-collage" id="editableCollage" aria-label="可编辑拼图预览"></div>
          </div>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
